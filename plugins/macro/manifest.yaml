name: macro
version: "0.4.0"
description: Fed balance sheet, US yields, USD index, USDCNY, CPI & inflation, credit/volatility, labour-market and H.8 bank balance-sheet tracker
capabilities:
  windowedBackfill: true
  maxBackfillDays: 3650
  requiresSecrets: [FRED_API_KEY]
  mockAvailable: true
entities:
  - id: FED
    name: 美联储
    namespace: fed
    type: institution
    tags: [central_bank, us]
  - id: US
    name: 美国
    namespace: us
    type: market
    tags: [us]
metrics:
  - id: fed.ins.balance_sheet
    name: 美联储资产负债表（美元）
    description: 美联储持有的总资产规模，单位美元
    unit: USD
    frequency: weekly
    entity: FED
  - id: us.mkt.ten_year_yield
    name: 10年期美债收益率（%）
    description: 美国 10 年期国债收益率
    unit: "%"
    frequency: daily
    entity: US
  - id: us.mkt.dollar_index
    name: 美联储广义贸易加权美元指数（DTWEXBGS）
    description: >-
      美联储名义广义贸易加权美元指数（FRED DTWEXBGS，2006 年 1 月=100）。
      不是 ICE 美元指数（DXY）：两者篮子和基期都不同，DTWEXBGS 读数约 119，
      DXY 约 100。按 DXY 写的阈值不能直接套用。
    unit: index
    frequency: daily
    entity: US
  - id: us.mkt.usd_cny
    name: 美元兑人民币汇率（离岸）
    description: 离岸市场美元兑人民币即期汇率
    unit: CNY per USD
    frequency: daily
    entity: US
  - id: us.mkt.cpi
    name: 美国消费者物价指数（CPI-U，季调）
    description: 美国城镇消费者物价指数（CPI-U），经季节性调整
    unit: index
    frequency: monthly
    entity: US
  - id: us.mkt.inflation_yoy
    name: 美国同比通胀率（%）
    description: 基于 CPI 的消费者价格同比变化率
    unit: "%"
    frequency: monthly
    entity: US
  - id: fed.ins.reserves
    name: 美联储准备金余额（周三时点）
    description: >-
      美联储准备金余额周三时点（FRED WRBWFRBL，H.4.1 Wednesday Level，百万美元 ×1e6）。
      不是周平均 WRESBAL。数据来源：FRED（public domain）。
    unit: USD
    frequency: weekly
    entity: FED
  - id: us.mkt.iorb
    name: 准备金余额利率（IORB，%）
    description: 美联储准备金余额利率（IORB）。数据来源：FRED（public domain）。
    unit: "%"
    frequency: daily
    entity: US
  - id: us.mkt.effr
    name: 有效联邦基金利率（%）
    description: >-
      有效联邦基金利率。数据来源：FRED EFFR。
      原始提供方须署名：纽约联邦储备银行（NY Fed）。
    unit: "%"
    frequency: daily
    entity: US
  - id: us.mkt.real_yield_10y
    name: 10年期 TIPS 实际收益率（%）
    description: 10年期国债通胀保护证券（TIPS）实际收益率。数据来源：FRED DFII10（public domain）。
    unit: "%"
    frequency: daily
    entity: US
  - id: us.mkt.term_spread_10y3m
    name: 10年−3月国债期限利差（百分点）
    description: >-
      10年期与3个月期国债收益率之差（百分点）。数据来源：FRED T10Y3M。
      原始提供方须署名：美国财政部。
    unit: pp
    frequency: daily
    entity: US
  - id: us.mkt.nfci
    name: 芝加哥联储全国金融状况指数
    description: >-
      芝加哥联邦储备银行全国金融状况指数。数据来源：FRED NFCI。
      原始提供方须署名：芝加哥联邦储备银行。
    unit: index
    frequency: weekly
    entity: US
  - id: us.mkt.term_spread_10y2y
    name: 10年−2年国债期限利差（百分点）
    description: >-
      10年期与2年期国债收益率之差（百分点），与 10y−3m 互为衰退信号的两种口径。
      数据来源：FRED T10Y2Y。原始提供方须署名：美国财政部。
    unit: pp
    frequency: daily
    entity: US
  - id: us.mkt.breakeven_10y
    name: 10年期盈亏平衡通胀率（%）
    description: >-
      10年期名义国债与 TIPS 收益率之差，市场隐含的 10 年平均通胀预期。
      数据来源：FRED T10YIE（圣路易斯联储据美国财政部数据计算）。
    unit: "%"
    frequency: daily
    entity: US
  - id: us.mkt.hy_oas
    name: 美国高收益债期权调整利差（%）
    description: >-
      ICE BofA 美国高收益债指数期权调整利差（OAS），信用风险偏好指标。
      数据来源：FRED BAMLH0A0HYM2。原始提供方须署名：ICE Data Indices；
      版权归 ICE，仅限个人、内部非商业使用，FRED 只提供近三年数据。
    unit: "%"
    frequency: daily
    entity: US
  - id: us.mkt.vix
    name: CBOE 波动率指数 VIX
    description: >-
      标普 500 期权隐含的 30 日波动率。数据来源：FRED VIXCLS。
      原始提供方须署名：芝加哥期权交易所（CBOE）；版权归 CBOE，商用需另行授权。
    unit: index
    frequency: daily
    entity: US
  - id: us.mkt.unemployment_rate
    name: 美国失业率（%）
    description: >-
      美国 U-3 失业率，季调。数据来源：FRED UNRATE。
      原始提供方须署名：美国劳工统计局（BLS）。
    unit: "%"
    frequency: monthly
    entity: US
  - id: us.mkt.sahm_realtime
    name: Sahm 规则实时衰退指标（百分点）
    description: >-
      失业率 3 个月均值相对前 12 个月最低点的升幅，≥0.5 历史上对应衰退开始。
      数据来源：FRED SAHMREALTIME（按当期发布数据计算，不回溯修订）。
      原始提供方须署名：Claudia Sahm。
    unit: pp
    frequency: monthly
    entity: US
  - id: us.mkt.initial_claims_4wk
    name: 首次申领失业救济人数（4 周均值）
    description: >-
      首次申领失业救济人数 4 周移动平均，季调。数据来源：FRED IC4WSA。
      原始提供方须署名：美国劳工部就业与培训管理局。
    unit: persons
    frequency: weekly
    entity: US
  - id: us.mkt.gdp_nominal
    name: 美国名义 GDP（年化，美元）
    description: >-
      美国名义国内生产总值，季调年化，十亿美元 ×1e9；用作准备金/GDP 等比值的分母。
      数据来源：FRED GDP。原始提供方须署名：美国经济分析局（BEA）。
    unit: USD
    frequency: quarterly
    entity: US
  - id: us.mkt.bank_credit
    name: 美国商业银行信贷总额（美元）
    description: >-
      全部商业银行银行信贷（证券 + 贷款），季调，周三时点，十亿美元 ×1e9。
      数据来源：FRED TOTBKCR（美联储 H.8）。H.8 周数据按季末 Call Report 回溯基准修正，
      历史值会被改写。原始提供方须署名：美联储理事会（public domain）。
    unit: USD
    frequency: weekly
    entity: US
  - id: us.mkt.bank_deposits
    name: 美国商业银行存款总额（美元）
    description: >-
      全部商业银行存款，季调，周三时点，十亿美元 ×1e9。
      数据来源：FRED DPSACBW027SBOG（美联储 H.8），同样受基准修正影响。
      原始提供方须署名：美联储理事会（public domain）。
    unit: USD
    frequency: weekly
    entity: US
  - id: us.mkt.bank_cash_assets
    name: 美国商业银行现金资产（美元）
    description: >-
      全部商业银行现金资产（含在美联储的准备金），季调，周三时点，十亿美元 ×1e9。
      数据来源：FRED CASACBW027SBOG（美联储 H.8）。与 fed.ins.reserves 口径不同（后者为全部存款机构、非季调）。
      原始提供方须署名：美联储理事会（public domain）。
    unit: USD
    frequency: weekly
    entity: US
  - id: us.mkt.usd_jpy
    name: 美元兑日元（日元/美元）
    description: >-
      美元兑日元即期汇率（纽约午间买入价）。数据来源：FRED DEXJPUS（美联储 H.10）。
      套息交易规模无法从汇率反推。原始提供方须署名：美联储理事会（public domain）。
    unit: JPY per USD
    frequency: daily
    entity: US
  - id: us.mkt.vix3m
    name: CBOE 3 个月波动率指数 VIX3M
    description: >-
      标普 500 期权隐含的 3 个月波动率。数据来源：FRED VXVCLS。
      与 us.mkt.vix 之比即 VIX 期限结构，比值 < 1 常见于事件日，非必然压力。
      原始提供方须署名：芝加哥期权交易所（CBOE）；版权归 CBOE，商用需另行授权。
    unit: index
    frequency: daily
    entity: US
relations:
  - source: FED
    target: US
    type: causes
    direction: forward
    description: Fed policy causes changes in US macro conditions
rules:
  - name: fed_balance_drop
    metric: fed.ins.balance_sheet
    detector: trend
    severity: info
    config: '{"direction":"down","consecutive":4}'
    display_name: 美联储资产负债表连续 4 周收缩
    description: 美联储资产负债表连续 4 周以上收缩（量化紧缩信号）
  - name: yield_spike_percentile
    metric: us.mkt.ten_year_yield
    detector: percentile
    severity: warning
    config: '{"percentile":90,"consecutive":2}'
    display_name: 10年期美债收益率连续 2 日处于 90 分位以上
    description: 10 年期美债收益率连续 2 日处于 90 分位及以上
  # 原为 threshold gt 105——那是照 DXY 定的阈值，而本指标是 DTWEXBGS
  # （实测 2026-08-28 = 118.7479），永久为真。改为相对自身 20 日均线：
  # 均线跟着序列走，结构上不可能一直为真。
  # margin 1.5 由两年 DTWEXBGS 实测定出（value-SMA20 的 p95=1.566），
  # 触发率约 6.3% 的交易日。
  # min_observations 不是 moving_average 读的字段，而是喂给 Core 的
  # frequencyAwareLookback——它只认 consecutive / min_observations，看不见
  # window。不写这一项，回看窗口只按 5 期算，SMA20 会静默退化成 SMA5。
  - name: usd_index_extreme
    metric: us.mkt.dollar_index
    detector: moving_average
    severity: info
    config: '{"window":20,"margin":1.5,"above":true,"min_observations":25}'
    display_name: 美联储广义贸易加权美元指数高于自身 20 日均线 1.5 点以上
    description: 美联储广义贸易加权美元指数高于自身 20 日均线 1.5 点以上——相对自身分布的强势偏离
  - name: inflation_above_target
    metric: us.mkt.inflation_yoy
    detector: threshold
    severity: warning
    config: '{"operator":"gt","value":3.0,"consecutive":2}'
    display_name: 美国同比通胀率连续 2 个月高于 3%
    description: 同比通胀率连续 2 个月高于 3%（高于美联储目标）
changeLog: "Liquidity batch 2 (collect only, no new rules): H.8 bank credit / deposits / cash assets, USDJPY, VIX3M"
