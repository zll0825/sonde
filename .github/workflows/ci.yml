# Sonde — CI Pipeline
# M0 deliverable: gofmt / go build / go vet / go test / buf lint

name: CI

on:
  push:
    branches: [main, longcat/**, codex/**]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: gofmt
        run: |
          FILES=$(gofmt -l .)
          if [ -n "$FILES" ]; then
            echo "The following files need formatting:"
            echo "$FILES"
            exit 1
          fi

      - name: go vet
        run: |
          go vet ./...
          for m in plugins/etf plugins/crypto plugins/macro plugins/commodities plugins/fedops; do (cd "$m" && go vet ./...); done

      - name: buf lint
        uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.34.0"
      - run: buf lint proto

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build all packages
        run: |
          # NOTE: `go build ./...` only matches the root module — plugin
          # modules must be built explicitly or they escape CI entirely.
          go build ./...
          for m in plugins/etf plugins/crypto plugins/macro plugins/commodities plugins/fedops; do (cd "$m" && go build ./...); done

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    services:
      timescaledb:
        image: timescale/timescaledb:2.16.1-pg16
        env:
          POSTGRES_USER: sonde
          POSTGRES_PASSWORD: sonde_test
          POSTGRES_DB: sonde_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://sonde:sonde_test@localhost:5432/sonde_test?sslmode=disable
      # Integration tests (internal/core/ontology) gate on TEST_DATABASE_URL;
      # without it they skip and the TimescaleDB service above goes unused.
      TEST_DATABASE_URL: postgres://sonde:sonde_test@localhost:5432/sonde_test?sslmode=disable
      # Notification tests must be deterministic even when repository or runner
      # environments provide credentials.
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_CHAT_ID: ""
      WEBHOOK_URL: ""
      WEBHOOK_TOKEN: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Apply migrations
        run: |
          go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.17.1
          migrate -path ./migrations -database "$DATABASE_URL" up

      - name: Run short tests
        run: make test-short

      - name: Run full tests and race gates
        run: |
          go test -v -race -count=1 ./...
          for m in plugins/etf plugins/crypto plugins/macro plugins/commodities plugins/fedops; do (cd "$m" && go test -v -race -count=1 ./...); done
