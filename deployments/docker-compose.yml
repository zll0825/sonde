# Capital Observatory — Local Development Stack
# M0 deliverable: PostgreSQL 16 + TimescaleDB 2.16
#
# Usage:
#   docker compose up -d        # start database
#   make migrate-up             # apply baseline migration
#   make dev                    # start core hot-reload (after M1)

services:
  timescaledb:
    image: timescale/timescaledb:2.16.1-pg16
    container_name: capital-observatory-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: capital
      POSTGRES_PASSWORD: capital_dev
      POSTGRES_DB: capital_observatory
    ports:
      - "5432:5432"
    volumes:
      - tsdb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capital -d capital_observatory"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  tsdb_data:
