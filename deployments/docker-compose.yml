# Capital Observatory — Full-Stack Dev Environment
# M0–M6 deliverable: PostgreSQL + TimescaleDB + Core (gRPC) + API + ETF + Macro + Crypto
#
# Usage:
#   make dev-up     # start database (compose) + migrate + core + api + etf + macro + crypto
#   make dev-logs   # tail service logs
#   make dev-down   # stop everything
#
# After startup:
#   - Database available at postgres://capital:capital_dev@localhost:5432/capital_observatory
#   - Core gRPC server at     :50051
#   - API + Frontend          http://localhost:8080/
#
# Plugins (see each service's PROVIDER env):
#   - etf-plugin      GLD + ETH-P ETF flow & prices (Yahoo Finance + mock flow)
#   - macro-plugin    Fed balance, US yields, USD index, USD/CNY (FRED real data)
#   - crypto-plugin   BTC price, hash rate, exchange balance (CoinGecko + mempool.space)
#
# To observe the live pipeline:
#   SELECT * FROM observations ORDER BY ingested_at DESC;
#   SELECT * FROM alerts;
#   SELECT * FROM research_snapshots;
#   SELECT * FROM command_log;

services:
  timescaledb:
    image: timescale/timescaledb:2.16.1-pg16
    container_name: capital-observatory-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: capital
      POSTGRES_PASSWORD: capital_dev
      POSTGRES_DB: capital_observatory
    ports:
      - "5432:5432"
    volumes:
      - tsdb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capital -d capital_observatory"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Core gRPC server: accepts plugin connections, runs M1–M6 pipeline.
  core:
    build:
      context: ../
      dockerfile: deployments/Dockerfile.core
    container_name: capital-observatory-core
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://capital:capital_dev@timescaledb:5432/capital_observatory?sslmode=disable
      CORE_BIND: ":50051"
      # Notification channels, interpolated from the HOST shell that runs
      # `docker compose up`. Empty = channel disabled (NopNotifier fallback).
      # Telegram takes priority over the generic webhook if both are set.
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:-}"
      WEBHOOK_URL: "${WEBHOOK_URL:-}"
      WEBHOOK_TOKEN: "${WEBHOOK_TOKEN:-}"
    ports:
      - "50051:50051"

  # API server: REST endpoints + static frontend
  api:
    build:
      context: ../
      dockerfile: deployments/Dockerfile.api
    container_name: capital-observatory-api
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://capital:capital_dev@timescaledb:5432/capital_observatory?sslmode=disable
      API_BIND: ":8080"
      # 控制端点（sync/backfill）Bearer 令牌；空 = 拒绝写操作，读端点不受影响
      API_TOKEN: "${API_TOKEN:-}"
      WEB_DIR: "/app/web"
    ports:
      - "8080:8080"

  # ETF Plugin: GLD real price via Yahoo Finance; synthetic ETF flow (no free public source).
  etf-plugin:
    build:
      context: ../
      dockerfile: deployments/Dockerfile.plugin
      args:
        PLUGIN_DIR: etf
    container_name: capital-observatory-etf
    restart: unless-stopped
    depends_on:
      - core
    environment:
      CORE_ADDR: "core:50051"
      PLUGIN_ID: "etf"
      COLLECTION_INTERVAL: "24h"          # daily interval (ETF data cadence)
      PROVIDER: "yahoo"                    # "yahoo" = real GLD price; "mock" = synthetic

  # Macro Plugin: Fed balance, US yields, USD index, USD/CNY from FRED.
  # Requires FRED_API_KEY (free at https://fred.stlouisfed.org). Without it the
  # plugin fails fast at startup -- this is intentional (silent mock is worse).
  macro-plugin:
    build:
      context: ../
      dockerfile: deployments/Dockerfile.plugin
      args:
        PLUGIN_DIR: macro
    container_name: capital-observatory-macro
    restart: unless-stopped
    depends_on:
      - core
    environment:
      CORE_ADDR: "core:50051"
      PLUGIN_ID: "macro"
      COLLECTION_INTERVAL: "1h"           # FRED publishes daily/weekly -- hourly poll
      PROVIDER: "fred"                    # "fred" = real FRED data; "mock" = synthetic
      FRED_API_KEY: "${FRED_API_KEY:-}"     # REQUIRED -- fails fast if unset

  # Crypto Plugin: BTC price (CoinGecko), hash rate (mempool.space), exchange balance (mock).
  # No API key required for the free public endpoints.
  crypto-plugin:
    build:
      context: ../
      dockerfile: deployments/Dockerfile.plugin
      args:
        PLUGIN_DIR: crypto
    container_name: capital-observatory-crypto
    restart: unless-stopped
    depends_on:
      - core
    environment:
      CORE_ADDR: "core:50051"
      PLUGIN_ID: "crypto"
      COLLECTION_INTERVAL: "1h"           # public APIs are low-rate-limit
      PROVIDER: "real"                    # "real" = CoinGecko+mempool; "mock" = synthetic

volumes:
  tsdb_data:
