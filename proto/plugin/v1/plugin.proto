syntax = "proto3";
package sonde.plugin.v1;
option go_package = "sonde/pkg/proto/plugin/v1;pluginv1";

// ===========================================================================
// PluginHost — Core exposes this service to Plugins
// ===========================================================================
service PluginHost {
  rpc RegisterPlugin(RegisterPluginRequest) returns (RegisterPluginResponse);
  rpc MaintainSession(stream PluginMessage) returns (stream CoreMessage);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
}

// ===========================================================================
// Enums
// ===========================================================================
enum EntityType {
  ENTITY_TYPE_UNSPECIFIED = 0;
  ENTITY_TYPE_ASSET = 1;
  ENTITY_TYPE_INSTRUMENT = 2;
  ENTITY_TYPE_FLOW = 3;
  ENTITY_TYPE_INSTITUTION = 4;
  ENTITY_TYPE_INDICATOR = 5;
  ENTITY_TYPE_INDEX = 6;
  ENTITY_TYPE_MARKET = 7;
}

enum RelationLayer {
  RELATION_LAYER_UNSPECIFIED = 0;
  RELATION_LAYER_STRUCTURAL = 1;
  RELATION_LAYER_SEMANTIC = 2;
  RELATION_LAYER_STATISTICAL = 3;
  RELATION_LAYER_CAUSAL = 4;
}

enum Direction {
  DIRECTION_UNSPECIFIED = 0;
  DIRECTION_FORWARD = 1;
  DIRECTION_BACKWARD = 2;
  DIRECTION_BIDIRECTIONAL = 3;
}

enum Severity {
  SEVERITY_UNSPECIFIED = 0;
  SEVERITY_CRITICAL = 1;
  SEVERITY_WARNING = 2;
  SEVERITY_INFO = 3;
}

enum QualityGrade {
  QUALITY_GRADE_UNSPECIFIED = 0;
  QUALITY_GRADE_REALTIME = 1;
  QUALITY_GRADE_DELAYED = 2;
  QUALITY_GRADE_ESTIMATED = 3;
  QUALITY_GRADE_PRELIMINARY = 4;
  QUALITY_GRADE_REVISED = 5;
}

// Domain: Observation.source_class
enum SourceClass {
  SOURCE_CLASS_UNSPECIFIED = 0;
  SOURCE_CLASS_REAL = 1;
  SOURCE_CLASS_MOCK = 2;
  SOURCE_CLASS_TEST = 3;
}

// ===========================================================================
// Registration
// ===========================================================================
message PluginInfo {
  string name = 1;
  string version = 2;
  string description = 3;
  int32 collection_interval_secs = 4;
  int32 min_backfill_window_days = 5;
}

message EntityDeclaration {
  string id = 1;
  string name = 2;
  string namespace = 3;
  EntityType entity_type = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
}

message MetricDeclaration {
  string id = 1;
  string name = 2;
  string description = 3;
  string unit = 4;
  string frequency = 5;
  string entity_id = 6;
  map<string, string> tags = 7;
}

message RelationSuggestion {
  string source_id = 1;
  string target_id = 2;
  string relation_type = 3;
  Direction direction = 4;
  double confidence = 5;
  int64 typical_lag_secs = 6;
  string description = 7;
  string evidence = 8;
  RelationLayer suggested_layer = 10;
  StatisticalEvidence statistical_evidence = 11;
}

message StatisticalEvidence {
  string method = 1;
  int32 window_days = 2;
  double coefficient = 3;
  double p_value = 4;
  int32 sample_size = 5;
}

message RelationReview {
  string source_id = 1;
  string target_id = 2;
  string relation_type = 3;
  string decision = 4;
  string reason = 5;
  RelationSuggestion merged_into = 6;
}

message RuleSuggestion {
  string name = 1;
  string metric_id = 2;
  string detector_name = 3;
  Severity severity = 4;
  bytes config = 5;
  string description = 6;
  // Domain: Rule.display_name — UI label. Empty means fall back to name (slug).
  string display_name = 7;
  // Domain: Rule.mode — live | observe. Empty means live.
  string mode = 8;
}

message RuleReview {
  string name = 1;
  string decision = 2;
  string reason = 3;
}

// Domain: Plugin.capabilities — declared topology, not inferred by type assert.
message PluginCapabilities {
  bool windowed_backfill = 1;
  int32 max_backfill_days = 2;
  repeated string requires_secrets = 3;
  bool mock_available = 4;
}

message RegisterPluginRequest {
  PluginInfo info = 1;
  repeated EntityDeclaration entities = 2;
  repeated RelationSuggestion relations = 3;
  repeated MetricDeclaration metrics = 4;
  repeated RuleSuggestion rules = 5;
  string change_log = 10;
  PluginCapabilities capabilities = 11;
}

message RegisterPluginResponse {
  string plugin_id = 1;
  int32 registration_version = 2;
  bool success = 3;
  string message = 4;
  repeated RelationReview reviewed_relations = 5;
  repeated RuleReview reviewed_rules = 6;
}

// ===========================================================================
// Data Push
// ===========================================================================
message MetricSnapshot {
  string metric_id = 1;
  double value = 2;
  int64 timestamp = 3;
  map<string, string> labels = 4;
  string source_plugin = 5;
  string source_plugin_version = 6;
  string source_provider = 7;
  int64 source_fetched_at = 8;
  QualityGrade quality_grade = 9;
  double quality_confidence = 10;
  // Domain: Observation.source_class. Absent/zero means unknown.
  SourceClass source_class = 11;
}

message PushSnapshotsRequest {
  string plugin_id = 1;
  repeated MetricSnapshot snapshots = 2;
}

message PushSnapshotsResponse {
  bool success = 1;
  int32 inserted = 2;
  int32 deduplicated = 3;
  int32 rejected = 4;
  string message = 5;
}

// ===========================================================================
// Heartbeat
// ===========================================================================
message PluginStatus {
  string state = 1;
  int64 last_collect_at = 2;
  int32 last_collect_duration_ms = 3;
  int32 last_collect_count = 4;
  string last_collect_error = 5;
  int32 consecutive_errors = 6;
  map<string, string> runtime = 7;
}

message HeartbeatRequest {
  string plugin_id = 1;
  int64 timestamp = 2;
  PluginStatus status = 3;
}

message HeartbeatResponse {
  bool ok = 1;
  bool has_pending_command = 2;
}

// ===========================================================================
// Commands
// ===========================================================================
message SyncCommand {
  string command_id = 1;
  string reason = 2;
  repeated string metric_ids = 3;
}

message BackfillCommand {
  string command_id = 1;
  string reason = 2;
  int64 window_start = 3;
  int64 window_end = 4;
  repeated string metric_ids = 5;
}

message CommandAck {
  string command_id = 1;
  string status = 2;
  string message = 3;
  int64 timestamp = 4;
  int32 collected_count = 5;
  string error = 6;
}

// ===========================================================================
// Bidirectional Stream Messages
// ===========================================================================
message PluginMessage {
  oneof payload {
    PushSnapshotsRequest push_snapshots = 1;
    HeartbeatRequest heartbeat = 2;
    CommandAck command_ack = 3;
  }
}

message CoreMessage {
  oneof payload {
    SyncCommand sync = 1;
    BackfillCommand backfill = 2;
    PushAck push_ack = 3;       // M1: ack for stream push (ADR-9)
  }
}

message PushAck {
  string plugin_id = 1;
  int32 inserted = 2;
  int32 deduplicated = 3;
  int32 rejected = 4;
  string message = 5;
}
